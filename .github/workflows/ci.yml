name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Package IDs are <prefix>.Core/.Client/.AspNetCore/.Cli. Set the repository variable NEXUSMQ_PACKAGE_PREFIX to change it.
  PACKAGE_PREFIX: ${{ vars.NEXUSMQ_PACKAGE_PREFIX || 'NexusMQ' }}

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexusMQ.sln

      - name: Build
        run: dotnet build NexusMQ.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/NexusMQ.Tests/NexusMQ.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          --blame-hang-timeout 5m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  live-regression:
    name: Live regression (real servers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # On pushes: build the previous commit's server, so the upgrade checks read data written by the version before.
      - name: Build the previous version (upgrade checks)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --depth=1 origin "$BEFORE"
          git worktree add "$RUNNER_TEMP/previous" "$BEFORE"
          dotnet build "$RUNNER_TEMP/previous/src/NexusMQ.Server" -c Release -o "$RUNNER_TEMP/previous-server"
          echo "OLD_SERVER=$RUNNER_TEMP/previous-server/NexusMQ.Server.dll" >> "$GITHUB_ENV"

      # Samples, CLI, access keys, rate limits, HTTPS, primary/standby failover, Raft leader kill, membership changes,
      # minority refusal, upgrade from the previous version and benchmarks, each against real servers.
      - name: Run scripts/live-regression.sh
        run: ONLY="samples cli keys https ha cluster upgrade bench" WORK="$RUNNER_TEMP/regression" ./scripts/live-regression.sh

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-regression-logs
          path: ${{ runner.temp }}/regression/*.log
          if-no-files-found: ignore

  setup-windows:
    name: Windows setup (build, start, startup task)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the self-contained setup
        shell: pwsh
        run: ./scripts/make-setup.ps1 -Runtime win-x64 -Output "$env:RUNNER_TEMP\setup"

      - name: Start it with start-server.cmd and use the bundled CLI
        shell: pwsh
        run: |
          $s = "$env:RUNNER_TEMP\setup"
          if (-not (Test-Path "$s\server\NexusMQ.Server.exe")) { throw "NexusMQ.Server.exe missing" }
          Start-Process cmd.exe -ArgumentList "/c `"$s\start-server.cmd`"" -WindowStyle Hidden
          $up = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://localhost:5680/api/health | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { throw "the server did not start" }
          & "$s\nexusmq.cmd" --url http://localhost:5680 create queue orders; if ($LASTEXITCODE) { throw "create failed" }
          & "$s\nexusmq.cmd" --url http://localhost:5680 send orders "hello from the setup"; if ($LASTEXITCODE) { throw "send failed" }
          $out = & "$s\nexusmq.cmd" --url http://localhost:5680 receive orders | Out-String
          if ($out -notmatch "hello from the setup") { throw "message not received: $out" }
          if (-not (Test-Path "$s\server\data\entities\orders.journal")) { throw "data is not in server\data" }
          Get-Process NexusMQ.Server | Stop-Process -Force

      - name: Install, check and remove the startup task
        shell: pwsh
        run: |
          $s = "$env:RUNNER_TEMP\setup"
          $data = "$env:RUNNER_TEMP\nexusmq-data"
          & "$s\install-startup-task.ps1" -Urls http://localhost:5690 -DataDirectory $data
          $up = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://localhost:5690/api/health | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { Get-ScheduledTask NexusMQ | Get-ScheduledTaskInfo | Format-List; throw "the startup task did not start the server" }
          & "$s\nexusmq.cmd" --url http://localhost:5690 create queue t; if ($LASTEXITCODE) { throw "create failed" }
          & "$s\nexusmq.cmd" --url http://localhost:5690 send t "x"; if ($LASTEXITCODE) { throw "send failed" }
          if (-not (Test-Path "$data\entities\t.journal")) { throw "data is not in $data" }
          & "$s\uninstall-startup-task.ps1"
          Start-Sleep 3
          if (Get-ScheduledTask -TaskName NexusMQ -ErrorAction SilentlyContinue) { throw "the task is still registered" }
          $still = $true
          try { Invoke-RestMethod http://localhost:5690/api/health -TimeoutSec 3 | Out-Null } catch { $still = $false }
          if ($still) { throw "the server still runs after uninstalling" }

      - name: Install, restart, crash, stop and remove the Windows service
        shell: pwsh
        run: |
          $s = "$env:RUNNER_TEMP\setup"
          $data = "$env:RUNNER_TEMP\nexusmq-service-data"
          function Wait-Up([int]$seconds = 60) {
            foreach ($i in 1..$seconds) { try { Invoke-RestMethod http://localhost:5691/api/health | Out-Null; return $true } catch { Start-Sleep 1 } }
            return $false
          }
          & "$s\install-service.ps1" -Urls http://localhost:5691 -DataDirectory $data
          if (-not (Wait-Up)) { Get-Service NexusMQ | Format-List *; throw "the service did not start" }
          if ((Get-Service NexusMQ).Status -ne 'Running') { throw "Windows reports the service as $((Get-Service NexusMQ).Status)" }
          & "$s\nexusmq.cmd" --url http://localhost:5691 create queue svc; if ($LASTEXITCODE) { throw "create failed" }
          & "$s\nexusmq.cmd" --url http://localhost:5691 send svc "survives a restart"; if ($LASTEXITCODE) { throw "send failed" }

          Restart-Service NexusMQ          # clean stop (our STOP handling) and start
          if (-not (Wait-Up)) { throw "the service did not come back after Restart-Service" }
          $out = & "$s\nexusmq.cmd" --url http://localhost:5691 peek svc | Out-String
          if ($out -notmatch "survives a restart") { throw "message lost across the restart: $out" }

          Get-Process NexusMQ.Server | Stop-Process -Force   # a crash: Windows' recovery settings restart it after 5 s
          Start-Sleep 2
          if (-not (Wait-Up 45)) { throw "Windows did not restart the service after it crashed" }

          Stop-Service NexusMQ
          if ((Get-Service NexusMQ).Status -ne 'Stopped') { throw "the service did not stop" }
          $still = $true
          try { Invoke-RestMethod http://localhost:5691/api/health -TimeoutSec 3 | Out-Null } catch { $still = $false }
          if ($still) { throw "still serving after Stop-Service" }
          if (-not (Test-Path "$data\entities\svc.journal")) { throw "data is not in $data" }
          & "$s\uninstall-service.ps1"
          if (Get-Service -Name NexusMQ -ErrorAction SilentlyContinue) { throw "the service is still registered" }

  pack:
    name: Pack
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compute CI version
        shell: bash
        run: |
          base=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "VERSION=${base}-ci.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Pack
        shell: bash
        run: |
          for p in src/NexusMQ.Core src/NexusMQ.Client src/NexusMQ.AspNetCore src/NexusMQ.Cli; do
            dotnet pack "$p" -c Release -o artifacts \
              -p:Version="$VERSION" \
              -p:NexusMQPackagePrefix="$PACKAGE_PREFIX" \
              -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" \
              -p:RepositoryCommit="${{ github.sha }}"
          done

      - name: Smoke-test the CLI tool package
        shell: bash
        run: |
          dotnet tool install --tool-path ./tool "$PACKAGE_PREFIX.Cli" --version "$VERSION" --add-source ./artifacts
          ./tool/nexusmq --version
          ./tool/nexusmq help | head -5

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  docker:
    name: Docker image builds
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nexusmq:ci

      - name: Smoke-test the container
        run: |
          docker run -d --name mq -p 5680:5680 -e NexusMQ__ApiKey=ci nexusmq:ci
          healthy=false
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:5680/api/health; then echo; healthy=true; break; fi
            sleep 1
          done
          if [ "$healthy" != true ]; then docker logs mq; exit 1; fi
          curl -fs -H "X-Api-Key: ci" -X PUT http://localhost:5680/api/queues/smoke
          curl -fs -H "X-Api-Key: ci" -H "Content-Type: application/json" -d '[{"body":"hello"}]' http://localhost:5680/api/send/smoke
          curl -fs -H "X-Api-Key: ci" http://localhost:5680/api/stats | grep '"active":1'
          docker logs mq | tail -20
          docker rm -f mq
