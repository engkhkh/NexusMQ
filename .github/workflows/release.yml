name: Release

# Push a tag like v1.7.0 to publish:
#   - NuGet packages to GitHub Packages (always) and to nuget.org (when the NUGET_API_KEY secret is set)
#   - a GitHub Release with the packages attached
#   - a multi-arch Docker image to ghcr.io/<owner>/nexusmq:<version> and :latest
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.7.0). Leave empty to use the tag.'
        required: false

permissions:
  contents: write   # create the GitHub Release
  packages: write   # GitHub Packages (NuGet) and ghcr.io

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Package IDs are <prefix>.Core/.Client/.AspNetCore/.Cli. Set the repository variable NEXUSMQ_PACKAGE_PREFIX to change it.
  PACKAGE_PREFIX: ${{ vars.NEXUSMQ_PACKAGE_PREFIX || 'NexusMQ' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/NexusMQ.Tests/NexusMQ.Tests.csproj -c Release --blame-hang-timeout 5m

  nuget:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Not a version: $v" >&2; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Pack
        shell: bash
        run: |
          for p in src/NexusMQ.Core src/NexusMQ.Client src/NexusMQ.AspNetCore src/NexusMQ.Cli; do
            dotnet pack "$p" -c Release -o artifacts \
              -p:Version="$VERSION" \
              -p:NexusMQPackagePrefix="$PACKAGE_PREFIX" \
              -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" \
              -p:RepositoryCommit="${{ github.sha }}"
          done
          ls -la artifacts

      - name: Push to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY secret not set: skipping nuget.org (packages are on GitHub Packages)."
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          flags=(--title "NexusMQ $VERSION" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* "${flags[@]}"
          fi

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Image name (lowercase owner)
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexusmq" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
